name: Distribute
'on':
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and test without creating a release
        type: boolean
        default: false
        required: false
  pull_request:
    paths:
    - .github/workflows/distribute.yml
    - .github/distribution/**
permissions:
  contents: read
concurrency:
  group: distribution
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m unittest discover -s .github/distribution -p "test_*.py" -v
  distribute:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - name: Verify selected branch
      shell: bash
      env:
        EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
      run: test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH" || test "${{ inputs.verify_only }}" = true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Archive the exact tracked source
      run: |-
        mkdir -p distribution-output
        git archive --format=zip --prefix=kohdalab-paperbot/ --output=distribution-output/kohdalab-paperbot-source.zip "$GITHUB_SHA"
      shell: bash
    - uses: astral-sh/setup-uv@v5
    - name: Test Python services without external connections
      run: |
        uv sync --locked
        make check
    - name: Validate publisher
      run: python -m unittest discover -s .github/distribution -p "test_*.py" -v
    - name: Publish verified distribution directly to Releases
      if: ${{ !inputs.verify_only }}
      env:
        GH_TOKEN: ${{ github.token }}
        DISTRIBUTION_BRANCH: ${{ github.event.repository.default_branch }}
        DISTRIBUTION_QUALIFICATION: Python compilation and unit tests. Source ZIP with dependency lockfile, Docker recipes and service entry points.
      run: python .github/distribution/publish_distribution.py --directory distribution-output --portable-glob "kohdalab-paperbot-source.zip" --alias kohdalab-paperbot-source.zip
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    needs: validate
