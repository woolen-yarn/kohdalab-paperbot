services:
  paperbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kohdalab-paperbot
    restart: unless-stopped
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      LLAMA_CHAT_BASE_URL: ${LLAMA_CHAT_BASE_URL:-http://rtx-pc.example.invalid:8080/v1}
      LLAMA_EMBED_BASE_URL: ${LLAMA_EMBED_BASE_URL:-http://rtx-pc.example.invalid:8081/v1}
      LLAMA_CHAT_MODEL: ${LLAMA_CHAT_MODEL:-paperbot-chat}
      LLAMA_EMBED_MODEL: ${LLAMA_EMBED_MODEL:-qwen3-embedding-4b}
      LLAMA_TEMPERATURE: ${LLAMA_TEMPERATURE:-0.2}
      LLAMA_MAX_TOKENS: ${LLAMA_MAX_TOKENS:-1024}
      LLAMA_REASONING_BUDGET: ${LLAMA_REASONING_BUDGET:-0}
      PAPERBOT_TRANSLATION_MODEL: ${PAPERBOT_TRANSLATION_MODEL:-paperbot-chat}
      PAPERBOT_TRANSLATION_ENABLED: ${PAPERBOT_TRANSLATION_ENABLED:-true}
      PAPERBOT_TOP_K: ${PAPERBOT_TOP_K:-6}
      PAPERBOT_SHORT_TOP_K: ${PAPERBOT_SHORT_TOP_K:-3}
      PAPERBOT_DEEP_TOP_K: ${PAPERBOT_DEEP_TOP_K:-8}
      PAPERBOT_MAX_PER_SOURCE: ${PAPERBOT_MAX_PER_SOURCE:-3}
      PAPERBOT_LOG_LEVEL: ${PAPERBOT_LOG_LEVEL:-INFO}
    volumes:
      - /volume1/docker/paperbot/rag_poc/papers:/app/rag_poc/papers
      - /volume1/docker/paperbot/rag_poc/index:/app/rag_poc/index
      - /volume1/docker/paperbot/logs:/app/logs
    command: ["python", "bot.py"]
